name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-lock.txt

      # Step 1 — governance skill drift-check (master.xlsx invariant 20 cross-sheet rules)
      # Phase 14 W3-W3-α strict mode (Q-CI-W3-03 RESOLVED runtime kanıt + 4 governance helper exec EXIT=0 4/4 zemin).
      - name: 1. drift-check
        run: python3 scripts/ci/run_skill_python.py skills/governance/drift-check/SKILL.md
        continue-on-error: false

      # Step 2 — governance skill schema-validate (jsonschema Draft7 all schemas + cross-sheet-invariants ≥20 rules (additive K-02))
      # Phase 14 W3-W3-α strict mode.
      - name: 2. schema-validate
        run: python3 scripts/ci/run_skill_python.py skills/governance/schema-validate/SKILL.md
        continue-on-error: false

      # Step 3 — governance skill glossary-audit (drift cross-ref REFERENCE_INDEX + spec section + reverse-lookup orphan/missing AMBER + defensive acronym whitelist 22-token)
      # Phase 14 W3-W3-α strict mode.
      - name: 3. glossary-audit
        run: python3 scripts/ci/run_skill_python.py skills/governance/glossary-audit/SKILL.md
        continue-on-error: false

      # Step 4 — pytest baseline + W2 yeni, no regression
      - name: 4. pytest
        run: pytest --tb=no -q
        continue-on-error: false

      # Step 4a — events.schema sanity (ADR-031: ensure schema is loadable; the
      # full per-row validation runs in tests/state/test_events_schema_compliance.py
      # which skips cleanly when PSEO_WORKSPACE_ROOT is unbound — this engine CI
      # does NOT have a workspace, so the strict per-row gate fires only in
      # workspace-bound contexts. The sanity check keeps the contract visible.)
      - name: 4a. events-schema-sanity
        run: |
          python3 -c "
          import json, jsonschema
          schema = json.load(open('schemas/events.schema.json'))
          jsonschema.Draft7Validator.check_schema(schema)
          print('events.schema.json: Draft7 valid')
          "
        continue-on-error: false

      # Step 5 — plugin agnostik invariant (.mcp.json 4 server + skill body slug hardcode YOK F-16)
      # Wave 2 strict: `|| true` mask removed (real exit code visible).
      # Adjacent-slug-pair patterns filter F-16 disclaimer multi-line lists
      # (real hardcode = 1 slug; disclaimer enumerates 8 slugs across 2-3 lines).
      - name: 5. plugin-agnostik-grep
        run: |
          # .mcp.json 4 server invariant (gsc + dataforseo + ScraplingServer + sf; v1.8 ADR-039)
          test "$(jq '.mcpServers | keys | length' .mcp.json)" = "4"
          # Skill body slug grep — word-boundary + F-16 disclaimer exclude.
          # Filter expansion: adjacent-slug pairs catch multi-line disclaimer
          # continuation lines (lesson 28 mop-up 6'ıncı uygulama → Wave 2 strict).
          ! grep -rEn "\b(dentnotion|vento|eykom|bigcattr|calitte|lastiksa|noraninsaat|adstark)\b" \
            skills/ --include=SKILL.md \
            | grep -vE "No project slug hardcoded|F-16 disclaimer|plugin agnostik|are FORBIDDEN|slug'lar|dentnotion.*vento|vento.*eykom|eykom.*bigcattr|bigcattr.*calitte|calitte.*lastiksa|lastiksa.*noraninsaat|noraninsaat.*adstark"
        continue-on-error: false

      # Step 6 — secret-grep (Phase 14+ CI Rule 3 production-ready 11-phase invariant)
      # Lesson 11 üçüncü surface mop-up Phase 14 W2: regex literal wrapper script'e
      # taşındı (deployment config kategori-spesifik convention, Phase 14 W1
      # placeholder convention paralel evolution).
      - name: 6. secret-grep
        run: bash scripts/ci/check_secrets.sh
        continue-on-error: false

      # Step 7 — frontmatter-compile (skill-frontmatter.schema.json Draft7 validate her SKILL.md frontmatter, 45 SKILL.md compliance)
      - name: 7. frontmatter-compile
        run: |
          python3 -c "
          import yaml, jsonschema, json, glob, sys
          schema = json.load(open('schemas/skill-frontmatter.schema.json'))
          fail_count = 0
          skill_files = sorted(glob.glob('skills/**/SKILL.md', recursive=True))
          for f in skill_files:
              body = open(f).read()
              if not body.startswith('---'):
                  print(f'NO_FRONTMATTER: {f}'); fail_count += 1; continue
              end = body.find('---', 3)
              fm = yaml.safe_load(body[3:end])
              try:
                  jsonschema.Draft7Validator(schema).validate(fm)
              except Exception as e:
                  print(f'FAIL: {f} -- {str(e.message)[:80]}'); fail_count += 1
          print(f'frontmatter-compile: {len(skill_files)-fail_count}/{len(skill_files)} PASS')
          sys.exit(fail_count)
          "
        continue-on-error: false
