name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]  # K-10/ADR-042: 3.10 EOL 2026-10
    steps:
      # Supply-chain: actions pinned by full commit SHA (mutable tags can be
      # re-pointed upstream); human tag kept as trailing comment, refreshed by
      # the weekly Dependabot github-actions stream (.github/dependabot.yml).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-lock.txt

      # Step 1 — cross-sheet invariants (K-01): runs validate_invariants on a copy of
      # templates/master-excel.xlsx. Red on any FAIL or when the NOT_IMPLEMENTED set
      # (7 of 32 declared today) changes. The old step ran SKILL.md blocks with a
      # hard-coded GREEN and evaluated 0 rules.
      - name: 1. drift-check
        run: python3 scripts/ci/drift_gate.py
        continue-on-error: false

      # Step 2 — schema-validate: runs the schema-validate SKILL.md blocks (every
      # schemas/*.json is a valid Draft7 schema; cross-sheet-invariants.json has rules).
      - name: 2. schema-validate
        run: python3 scripts/ci/run_skill_python.py skills/governance/schema-validate/SKILL.md
        continue-on-error: false

      # Step 3 — glossary (K-07): red when a spec §20 term is missing from
      # docs/GLOSSARY.md, REFERENCE_INDEX loses its glossary link, or orphan
      # glossary terms exceed the budget. The old step computed these and
      # discarded them.
      - name: 3. glossary-audit
        run: python3 scripts/ci/glossary_gate.py
        continue-on-error: false

      # Step 4 — full pytest suite; red on any failure, on more than SKIP_BUDGET
      # skipped tests (tests/conftest.py, K-05) or on coverage below the floor.
      - name: 4. pytest
        env:
          # Feeds tests/ci/test_client_scrub_guard.py; absent on forks → guard skips.
          CLIENT_SLUG_PATTERN: ${{ secrets.CLIENT_SLUG_PATTERN }}
        # K-15: coverage floor — 80 % measured 2026-10-19; fail-under 79 blocks a drop.
        run: pytest --tb=short -q --cov=scripts --cov-report=term --cov-fail-under=79
        continue-on-error: false

      # Step 4b — lint (K-09): pyflakes-class errors only (unused imports and
      # variables, undefined names, f-strings without placeholders). Fast and
      # quiet; style rules are deliberately not enabled.
      - name: 4b. ruff-lint
        run: ruff check --select F scripts tests
        continue-on-error: false

      # Step 4a — events.schema sanity (ADR-031: ensure schema is loadable; the
      # full per-row validation runs in tests/state/test_events_schema_compliance.py
      # which skips cleanly when PSEO_WORKSPACE_ROOT is unbound — this engine CI
      # does NOT have a workspace, so the strict per-row gate fires only in
      # workspace-bound contexts. The sanity check keeps the contract visible.)
      - name: 4a. events-schema-sanity
        run: |
          python3 -c "
          import json, jsonschema
          schema = json.load(open('schemas/events.schema.json'))
          jsonschema.Draft7Validator.check_schema(schema)
          print('events.schema.json: Draft7 valid')
          "
        continue-on-error: false

      # Step 5 — plugin-agnostic invariant (.mcp.json has exactly 5 servers +
      # repo-wide client-slug grep F-16)
      # 2026-07-08 client-name scrub: the forbidden-slug list moved into the
      # CLIENT_SLUG_PATTERN repo secret — a public repo's own guard must not
      # advertise the very names it forbids. Scope widened from skills/-only to
      # repo-wide (post-scrub zero matches, so no disclaimer-exclude pipe needed).
      # Absent/empty secret (forks, Dependabot) → slug grep no-ops; the .mcp.json
      # invariant still runs. Wave 2 strict: no `|| true` mask.
      - name: 5. plugin-agnostik-grep
        env:
          CLIENT_SLUG_PATTERN: ${{ secrets.CLIENT_SLUG_PATTERN }}
        run: |
          # .mcp.json 5 server invariant (gsc + dataforseo + ScraplingServer + sf, v1.8 ADR-039;
          # + adstark for refresh-audit). xquik removed 2026-09-17.
          test "$(jq '.mcpServers | keys | length' .mcp.json)" = "5"
          # Repo-wide client-slug grep (pattern from repo secret; -I skips binaries)
          # K-08: explicit exit code — 0 = slug found (FAIL), 1 = clean,
          # anything else = grep failed (e.g. a broken pattern) → FAIL, not PASS.
          if [ -n "$CLIENT_SLUG_PATTERN" ]; then
            set +e
            grep -rIEn "$CLIENT_SLUG_PATTERN" . --exclude-dir=.git
            rc=$?
            set -e
            [ "$rc" -eq 1 ] || { echo "client-slug grep: FAIL (exit $rc)"; exit 1; }
          fi
        continue-on-error: false

      # Step 6 — secret-grep: the canonical scanner (34 classes, K-11) over the
      # tree + a committed-literal git grep with explicit exit codes (K-08).
      - name: 6. secret-grep
        run: bash scripts/ci/check_secrets.sh
        continue-on-error: false

      # Step 7 — frontmatter-compile: every SKILL.md frontmatter validates against
      # skill-frontmatter.schema.json (50 SKILL.md today).
      - name: 7. frontmatter-compile
        run: |
          python3 -c "
          import yaml, jsonschema, json, glob, sys
          schema = json.load(open('schemas/skill-frontmatter.schema.json'))
          fail_count = 0
          skill_files = sorted(glob.glob('skills/**/SKILL.md', recursive=True))
          for f in skill_files:
              body = open(f).read()
              if not body.startswith('---'):
                  print(f'NO_FRONTMATTER: {f}'); fail_count += 1; continue
              end = body.find('---', 3)
              fm = yaml.safe_load(body[3:end])
              try:
                  jsonschema.Draft7Validator(schema).validate(fm)
              except Exception as e:
                  print(f'FAIL: {f} -- {str(e.message)[:80]}'); fail_count += 1
          print(f'frontmatter-compile: {len(skill_files)-fail_count}/{len(skill_files)} PASS')
          sys.exit(fail_count)
          "
        continue-on-error: false
